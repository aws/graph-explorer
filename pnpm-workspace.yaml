packages:
  - packages/*

overrides:
  semver@<7.0.0: ">=7.7.3"
  "@babel/core@<7.29.1": ">=7.29.1 <8"
  brace-expansion@>=5.0.0 <5.0.7: ">=5.0.7"
  dompurify@<3.4.12: ">=3.4.12"
  esbuild@>=0.17.0 <0.28.1: ">=0.28.1"
  flatted@<3.4.2: ">=3.4.2"
  form-data@>=4.0.0 <4.0.6: ">=4.0.6"
  minimatch@<10.2.3: ">=10.2.3"
  path-to-regexp@>=8.0.0 <8.4.0: ">=8.4.0"
  picomatch@>=4.0.0 <4.0.4: ">=4.0.4"
  yaml@>=2.0.0 <2.8.3: ">=2.8.3"
  vite@*: "catalog:"

# This prevents malicious packages from being installed by waiting 24 hours
# after a package is published. See https://pnpm.io/settings#minimumreleaseage
minimumReleaseAge: 1440

# Explicitly allow or deny packages running build scripts
allowBuilds:
  esbuild: true
  core-js: false

# Collapse compatible duplicate versions whenever the lockfile is written, so
# `pnpm dedupe --check` in CI rarely fails. Frozen installs skip it, which is
# why CI keeps that check.
autoDedupe: true

# Prevent transitive dependencies from using git or tarball URLs
blockExoticSubdeps: true

# Refuse to install a package version whose trust evidence is weaker than a
# previously published version of that package
trustPolicy: no-downgrade
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
