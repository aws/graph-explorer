name: Test build the Docker image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "packages/docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb

      - name: Build Docker image
        run: |
          docker buildx build --platform linux/amd64 --load -t test-image .

      - name: Build arm64 Docker image
        run: |
          docker buildx build --platform linux/arm64 --load -t test-image-arm64 .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: test-image
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Ensure openSSL is installed
        run: |
          docker run --rm --entrypoint="" test-image openssl --version

      - name: Ensure Node.js matches .node-version
        run: |
          expected="v$(cat .node-version)"
          actual=$(docker run --rm --entrypoint="" test-image node --version)
          [ "$actual" = "$expected" ] || { echo "FAIL: image has $actual, .node-version is $expected"; exit 1; }
          echo "✓ node $actual"

      - name: Ensure the arm64 image is arm64
        run: |
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' test-image-arm64)
          [ "$platform" = "linux/arm64" ] || { echo "FAIL: test-image-arm64 is $platform"; exit 1; }
          expected="v$(cat .node-version) arm64"
          actual=$(docker run --rm --platform linux/arm64 --entrypoint="" test-image-arm64 node -p 'process.version + " " + process.arch')
          [ "$actual" = "$expected" ] || { echo "FAIL: arm64 image has node $actual, expected $expected"; exit 1; }
          echo "✓ $platform, node $actual"

      - name: Verify build tooling is absent
        run: |
          docker run --rm --entrypoint="" test-image sh -c '
            (command -v npm && echo "FAIL: npm found" && exit 1) || echo "✓ npm absent"
            (command -v pnpm && echo "FAIL: pnpm found" && exit 1) || echo "✓ pnpm absent"
            (command -v corepack && echo "FAIL: corepack found" && exit 1) || echo "✓ corepack absent"
            (command -v python3 && echo "FAIL: python3 found" && exit 1) || echo "✓ python3 absent"
            (command -v yum && echo "FAIL: yum found" && exit 1) || echo "✓ yum absent"
            (command -v dnf && echo "FAIL: dnf found" && exit 1) || echo "✓ dnf absent"
          '

      # One run per way the entrypoint starts the server: plain HTTP on 80,
      # notebook mode on 9250, and HTTPS on 443, where HOST makes the entrypoint
      # generate a self-signed certificate. The ports are published on
      # 127.0.0.1, so the runner's other interfaces can't reach them. The last
      # run repeats the HTTP check on the arm64 image.
      - name: Verify server starts and responds
        run: |
          check() {
            image=$1 name=$2 host_port=$3 container_port=$4 scheme=$5
            shift 5
            docker run -d --name "$name" -p "127.0.0.1:$host_port:$container_port" "$@" "$image"
            for i in $(seq 1 60); do
              if curl -sfk "$scheme://127.0.0.1:$host_port/status"; then
                echo ""
                echo "✓ $name responded on /status"
                # The client build is the file most likely to go missing from the image.
                ui_status=$(curl -sk -o /dev/null -w '%{http_code}' "$scheme://127.0.0.1:$host_port/explorer/")
                if [ "$ui_status" != 200 ]; then
                  echo "FAIL: $name returned $ui_status for the UI at /explorer/"
                  docker rm -f "$name" >/dev/null
                  return 1
                fi
                echo "✓ $name served the UI at /explorer/"
                # The logger writes from a worker thread, so under emulation
                # the line can land after the server already answers.
                listening=false
                for j in $(seq 1 10); do
                  if docker logs "$name" 2>&1 | grep -Eq "Proxy server listening on (\[::\]|0\.0\.0\.0):$container_port([^0-9]|$)"; then
                    listening=true
                    break
                  fi
                  sleep 1
                done
                if [ "$listening" != true ]; then
                  echo "FAIL: $name did not log listening on every interface on port $container_port"
                  docker logs "$name"
                  docker rm -f "$name" >/dev/null
                  return 1
                fi
                echo "✓ $name listens on every interface"
                docker rm -f "$name" >/dev/null
                return 0
              fi
              sleep 1
            done
            echo "FAIL: $name did not respond within 60 seconds"
            docker logs "$name"
            docker rm -f "$name" >/dev/null
            return 1
          }
          check test-image http 8080 80 http -e PROXY_SERVER_HTTPS_CONNECTION=false
          check test-image notebook 9250 9250 http -e NEPTUNE_NOTEBOOK=true
          check test-image https 8443 443 https -e HOST=localhost
          check test-image-arm64 arm64 8082 80 http --platform linux/arm64 -e PROXY_SERVER_HTTPS_CONNECTION=false

      # Starting node directly skips docker-entrypoint.sh, so this proves the
      # image's PROXY_SERVER_LISTEN_ADDRESS reaches every way the server starts.
      - name: Verify the server listens on every interface without the entrypoint
        run: |
          docker run -d --name no-entrypoint -p 127.0.0.1:8081:80 --entrypoint node -w /graph-explorer/packages/graph-explorer-proxy-server test-image src/node-server.ts
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/status; then
              echo ""
              echo "✓ server started without the entrypoint responded on /status"
              docker rm -f no-entrypoint >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: server started without the entrypoint did not respond within 30 seconds"
          docker logs no-entrypoint
          docker rm -f no-entrypoint >/dev/null
          exit 1
