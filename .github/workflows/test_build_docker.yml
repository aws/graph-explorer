name: Test build the Docker image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "packages/docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: |
          docker build -t test-image .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: test-image
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Ensure openSSL is installed
        run: |
          docker run --rm --entrypoint="" test-image openssl --version

      - name: Ensure Node.js matches .node-version
        run: |
          expected="v$(cat .node-version)"
          actual=$(docker run --rm --entrypoint="" test-image node --version)
          [ "$actual" = "$expected" ] || { echo "FAIL: image has $actual, .node-version is $expected"; exit 1; }
          echo "✓ node $actual"

      - name: Verify build tooling is absent
        run: |
          docker run --rm --entrypoint="" test-image sh -c '
            (command -v npm && echo "FAIL: npm found" && exit 1) || echo "✓ npm absent"
            (command -v pnpm && echo "FAIL: pnpm found" && exit 1) || echo "✓ pnpm absent"
            (command -v corepack && echo "FAIL: corepack found" && exit 1) || echo "✓ corepack absent"
            (command -v python3 && echo "FAIL: python3 found" && exit 1) || echo "✓ python3 absent"
            (command -v yum && echo "FAIL: yum found" && exit 1) || echo "✓ yum absent"
            (command -v dnf && echo "FAIL: dnf found" && exit 1) || echo "✓ dnf absent"
          '

      # One run per way the entrypoint starts the server: plain HTTP on 80,
      # notebook mode on 9250, and HTTPS on 443, where HOST makes the entrypoint
      # generate a self-signed certificate. The ports are published on
      # 127.0.0.1, so the runner's other interfaces can't reach them. Each run
      # also names the log line about certificate generation that must appear,
      # or an empty name when none may.
      - name: Verify server starts and responds
        run: |
          check() {
            name=$1 host_port=$2 container_port=$3 scheme=$4 notice=$5
            shift 5
            docker run -d --name "$name" -p "127.0.0.1:$host_port:$container_port" "$@" test-image
            for i in $(seq 1 30); do
              if curl -sfk "$scheme://127.0.0.1:$host_port/status"; then
                echo ""
                echo "✓ $name responded on /status"
                # The client build is the file most likely to go missing from the image.
                ui_status=$(curl -sk -o /dev/null -w '%{http_code}' "$scheme://127.0.0.1:$host_port/explorer/")
                if [ "$ui_status" != 200 ]; then
                  echo "FAIL: $name returned $ui_status for the UI at /explorer/"
                  docker rm -f "$name" >/dev/null
                  return 1
                fi
                echo "✓ $name served the UI at /explorer/"
                if ! docker logs "$name" 2>&1 | grep -Eq "Proxy server listening on (\[::\]|0\.0\.0\.0):$container_port([^0-9]|$)"; then
                  echo "FAIL: $name did not log listening on every interface on port $container_port"
                  docker logs "$name"
                  docker rm -f "$name" >/dev/null
                  return 1
                fi
                echo "✓ $name listens on every interface"
                logs=$(docker logs "$name" 2>&1)
                if [ -n "$notice" ]; then
                  if ! grep -qF -- "$notice" <<< "$logs"; then
                    echo "FAIL: $name did not log: $notice"
                    echo "$logs"
                    docker rm -f "$name" >/dev/null
                    return 1
                  fi
                  echo "✓ $name logged: $notice"
                elif grep -q "Skipping self-signed certificate generation" <<< "$logs"; then
                  echo "FAIL: $name logged a notice that it skipped certificate generation"
                  echo "$logs"
                  docker rm -f "$name" >/dev/null
                  return 1
                fi
                docker rm -f "$name" >/dev/null
                return 0
              fi
              sleep 1
            done
            echo "FAIL: $name did not respond within 30 seconds"
            docker logs "$name"
            docker rm -f "$name" >/dev/null
            return 1
          }
          check http 8080 80 http "SSL disabled. Skipping self-signed certificate generation." -e PROXY_SERVER_HTTPS_CONNECTION=false
          check notebook 9250 9250 http "Neptune Notebook preset enabled. Skipping self-signed certificate generation." -e NEPTUNE_NOTEBOOK=true
          check https 8443 443 https "" -e HOST=localhost

      # Starting node directly skips docker-entrypoint.sh, so this proves the
      # image's PROXY_SERVER_LISTEN_ADDRESS reaches every way the server starts.
      - name: Verify the server listens on every interface without the entrypoint
        run: |
          docker run -d --name no-entrypoint -p 127.0.0.1:8081:80 --entrypoint node -w /graph-explorer/packages/graph-explorer-proxy-server test-image src/node-server.ts
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/status; then
              echo ""
              echo "✓ server started without the entrypoint responded on /status"
              docker rm -f no-entrypoint >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: server started without the entrypoint did not respond within 30 seconds"
          docker logs no-entrypoint
          docker rm -f no-entrypoint >/dev/null
          exit 1

      # The steps below wait on the container they start with wait_for_status.
      # It polls /status for up to 30 seconds, and on a timeout prints the
      # container's logs and removes it.
      - name: Define the status helper
        run: |
          cat > "$RUNNER_TEMP/wait-for-status.sh" <<'EOF'
          wait_for_status() {
            name=$1 url=$2
            for i in $(seq 1 30); do
              curl -sfk "$url/status" >/dev/null && return 0
              sleep 1
            done
            echo "FAIL: $name did not respond within 30 seconds"
            docker logs "$name"
            docker rm -f "$name" >/dev/null
            return 1
          }
          EOF

      # A restart keeps the container's files, so it reuses the certificate it
      # generated, and anyone who trusted that certificate keeps trusting it.
      - name: Verify a restart keeps the certificate
        run: |
          . "$RUNNER_TEMP/wait-for-status.sh"
          docker run -d --name restart -p 127.0.0.1:8445:443 -e HOST=localhost test-image
          wait_for_status restart https://127.0.0.1:8445 || exit 1
          certificate=/graph-explorer/packages/graph-explorer-proxy-server/cert-info/server.crt
          before=$(docker exec restart sha256sum "$certificate")
          docker restart restart >/dev/null
          wait_for_status restart https://127.0.0.1:8445 || exit 1
          after=$(docker exec restart sha256sum "$certificate")
          if [ "$before" != "$after" ]; then
            echo "FAIL: the restart generated a new certificate"
            docker rm -f restart >/dev/null
            exit 1
          fi
          echo "✓ the restart kept the certificate"
          docker rm -f restart >/dev/null

      # node is PID 1, so docker stop's SIGTERM reaches the server instead of
      # waiting out the timeout.
      - name: Verify docker stop stops the server promptly
        run: |
          . "$RUNNER_TEMP/wait-for-status.sh"
          docker run -d --name stop -p 127.0.0.1:8085:80 -e PROXY_SERVER_HTTPS_CONNECTION=false test-image
          wait_for_status stop http://127.0.0.1:8085 || exit 1
          start=$SECONDS
          docker stop -t 10 stop >/dev/null
          elapsed=$((SECONDS - start))
          if [ "$elapsed" -ge 5 ]; then
            echo "FAIL: docker stop took $elapsed seconds"
            docker rm -f stop >/dev/null
            exit 1
          fi
          if ! docker logs stop 2>&1 | grep -q "SIGTERM signal received"; then
            echo "FAIL: the server did not log receiving SIGTERM"
            docker logs stop
            docker rm -f stop >/dev/null
            exit 1
          fi
          echo "✓ docker stop stopped the server in $elapsed seconds"
          docker rm -f stop >/dev/null

      # Earlier versions appended a block of lines to .env at every start. A
      # folder that three starts left behind still starts.
      - name: Verify an .env with lines appended by earlier versions starts
        run: |
          . "$RUNNER_TEMP/wait-for-status.sh"
          mkdir old-env
          printf 'LOG_LEVEL=info\n' > old-env/.env
          for i in 1 2 3; do
            printf '\nNEPTUNE_NOTEBOOK=false\n\nPROXY_SERVER_HTTPS_CONNECTION=false\n\nGRAPH_EXP_HTTPS_CONNECTION=true\n' >> old-env/.env
          done
          docker run -d --name old-env -p 127.0.0.1:8083:80 -v "$PWD/old-env:/config" -e CONFIGURATION_FOLDER_PATH=/config -e PROXY_SERVER_HTTPS_CONNECTION=false test-image
          wait_for_status old-env http://127.0.0.1:8083 || exit 1
          echo "✓ an .env with appended lines served HTTP"
          docker rm -f old-env >/dev/null
