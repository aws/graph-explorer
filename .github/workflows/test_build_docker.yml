name: Test build the Docker image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure the Vite+ image matches the vite-plus catalog version
        run: |
          image=$(sed -n 's|^FROM ghcr.io/voidzero-dev/vite-plus:\([^@ ]*\)@.*|\1|p' Dockerfile)
          catalog=$(sed -n 's|^  vite-plus: *"\{0,1\}\([^"]*\)"\{0,1\}$|\1|p' pnpm-workspace.yaml)
          [ -n "$image" ] && [ "$image" = "$catalog" ] || { echo "FAIL: Dockerfile has vite-plus:$image, pnpm-workspace.yaml has vite-plus $catalog"; exit 1; }
          echo "✓ vite-plus $image"

      - name: Build Docker image
        run: |
          docker build -t test-image .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: test-image
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Ensure openSSL is installed
        run: |
          docker run --rm --entrypoint="" test-image openssl --version

      - name: Ensure Node.js matches .node-version
        run: |
          expected="v$(cat .node-version)"
          actual=$(docker run --rm --entrypoint="" test-image node --version)
          [ "$actual" = "$expected" ] || { echo "FAIL: image has $actual, .node-version is $expected"; exit 1; }
          echo "✓ node $actual"

      - name: Verify build tooling is absent
        run: |
          docker run --rm --entrypoint="" test-image sh -c '
            (command -v npm && echo "FAIL: npm found" && exit 1) || echo "✓ npm absent"
            (command -v pnpm && echo "FAIL: pnpm found" && exit 1) || echo "✓ pnpm absent"
            (command -v corepack && echo "FAIL: corepack found" && exit 1) || echo "✓ corepack absent"
            (command -v python3 && echo "FAIL: python3 found" && exit 1) || echo "✓ python3 absent"
            (command -v yum && echo "FAIL: yum found" && exit 1) || echo "✓ yum absent"
            (command -v dnf && echo "FAIL: dnf found" && exit 1) || echo "✓ dnf absent"
          '

      # One run per way the entrypoint starts the server: plain HTTP on 80,
      # notebook mode on 9250, and HTTPS on 443, where HOST makes the entrypoint
      # generate a self-signed certificate. The ports are published on
      # 127.0.0.1, so the runner's other interfaces can't reach them.
      - name: Verify server starts and responds
        run: |
          check() {
            name=$1 host_port=$2 container_port=$3 scheme=$4
            shift 4
            docker run -d --name "$name" -p "127.0.0.1:$host_port:$container_port" "$@" test-image
            for i in $(seq 1 30); do
              if curl -sfk "$scheme://127.0.0.1:$host_port/status"; then
                echo ""
                echo "✓ $name responded on /status"
                # The client build is the file most likely to go missing from the image.
                ui_status=$(curl -sk -o /dev/null -w '%{http_code}' "$scheme://127.0.0.1:$host_port/explorer/")
                if [ "$ui_status" != 200 ]; then
                  echo "FAIL: $name returned $ui_status for the UI at /explorer/"
                  docker rm -f "$name" >/dev/null
                  return 1
                fi
                echo "✓ $name served the UI at /explorer/"
                if ! docker logs "$name" 2>&1 | grep -Eq "Proxy server listening on (\[::\]|0\.0\.0\.0):$container_port([^0-9]|$)"; then
                  echo "FAIL: $name did not log listening on every interface on port $container_port"
                  docker logs "$name"
                  docker rm -f "$name" >/dev/null
                  return 1
                fi
                echo "✓ $name listens on every interface"
                docker rm -f "$name" >/dev/null
                return 0
              fi
              sleep 1
            done
            echo "FAIL: $name did not respond within 30 seconds"
            docker logs "$name"
            docker rm -f "$name" >/dev/null
            return 1
          }
          check http 8080 80 http -e PROXY_SERVER_HTTPS_CONNECTION=false
          check notebook 9250 9250 http -e NEPTUNE_NOTEBOOK=true
          check https 8443 443 https -e HOST=localhost

      # Starting node directly skips docker-entrypoint.sh, so this proves the
      # image's PROXY_SERVER_LISTEN_ADDRESS reaches every way the server starts.
      - name: Verify the server listens on every interface without the entrypoint
        run: |
          docker run -d --name no-entrypoint -p 127.0.0.1:8081:80 --entrypoint node -w /graph-explorer/packages/graph-explorer-proxy-server test-image src/node-server.ts
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/status; then
              echo ""
              echo "✓ server started without the entrypoint responded on /status"
              docker rm -f no-entrypoint >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: server started without the entrypoint did not respond within 30 seconds"
          docker logs no-entrypoint
          docker rm -f no-entrypoint >/dev/null
          exit 1
