name: Test build the Docker image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: |
          docker build -t test-image .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: test-image
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Ensure openSSL is installed
        run: |
          docker run --rm --entrypoint="" test-image openssl --version

      - name: Verify unnecessary packages are removed
        run: |
          docker run --rm --entrypoint="" test-image sh -c '
            (command -v npm && echo "FAIL: npm found" && exit 1) || echo "✓ npm removed"
            (command -v pnpm && echo "FAIL: pnpm found" && exit 1) || echo "✓ pnpm removed"
            (command -v corepack && echo "FAIL: corepack found" && exit 1) || echo "✓ corepack removed"
            (command -v python3 && echo "FAIL: python3 found" && exit 1) || echo "✓ python3 removed"
            (command -v yum && echo "FAIL: yum found" && exit 1) || echo "✓ yum removed"
            (command -v dnf && echo "FAIL: dnf found" && exit 1) || echo "✓ dnf removed"
          '

      # One run per way the entrypoint starts the server: plain HTTP on 80,
      # notebook mode on 9250, and HTTPS on 443 with freshly generated certs.
      - name: Verify server starts and responds
        run: |
          check() {
            name=$1 host_port=$2 container_port=$3 scheme=$4
            shift 4
            docker run -d --name "$name" -p "$host_port:$container_port" "$@" test-image
            for i in $(seq 1 30); do
              if curl -sfk "$scheme://localhost:$host_port/status"; then
                echo ""
                echo "✓ $name responded on /status"
                docker rm -f "$name" >/dev/null
                return 0
              fi
              sleep 1
            done
            echo "FAIL: $name did not respond within 30 seconds"
            docker logs "$name"
            docker rm -f "$name" >/dev/null
            return 1
          }
          check http 8080 80 http -e PROXY_SERVER_HTTPS_CONNECTION=false
          check notebook 9250 9250 http -e NEPTUNE_NOTEBOOK=true
          check https 8443 443 https -e HOST=localhost
