name: Build Docker image and publish to ECR

# A push to main publishes latest-SNAPSHOT. To publish a release, dispatch on
# its tag once the tag exists:
#
#   gh workflow run build_docker.yml --ref v<version> -f image_tag=release
#
# The release check fails the run unless the tag matches package.json and the
# version is new, and it moves latest only for the highest version.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag type"
        required: false
        type: choice
        options:
          - "latest"
          - "release"
        default: "latest"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Snapshot builds replace each other. A release gets a group of its own, so
  # a merge to main can't cancel it, or replace it while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == 'release' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == 'release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: ${{ env.IS_RELEASE == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Runs before anything is pushed.
      - name: Check the release and choose its tags
        id: release
        if: ${{ env.IS_RELEASE == 'true' }}
        run: node .github/scripts/releaseImage.ts plan

      - name: Get image tags
        id: get-image-tags
        env:
          RELEASE_TAGS: ${{ steps.release.outputs.tags }}
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            echo "tags=$RELEASE_TAGS" >> "$GITHUB_OUTPUT"
          else
            echo "tags=latest-SNAPSHOT sagemaker-latest-SNAPSHOT" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_ECR }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_ECR }}
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_ECR }}
          role-duration-seconds: 3600
          role-session-name: ExplorerImageUpdate

      - name: Login to Amazon ECR
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Build, tag, and push Docker image
        env:
          IMAGE: ${{ steps.login-ecr-public.outputs.registry }}/neptune/graph-explorer
          TAGS: ${{ steps.get-image-tags.outputs.tags }}
        # TAGS is a space-separated list, split on purpose.
        run: |
          # shellcheck disable=SC2086
          set -- $TAGS
          docker build -t "$IMAGE:$1" .
          for tag in "$@"; do
            docker tag "$IMAGE:$1" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

      - name: Check every pushed tag points to one image
        if: ${{ env.IS_RELEASE == 'true' }}
        env:
          TAGS: ${{ steps.get-image-tags.outputs.tags }}
        run: |
          # shellcheck disable=SC2086
          node .github/scripts/releaseImage.ts verify $TAGS
