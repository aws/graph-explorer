name: Build Docker image and publish to ECR

# A push to main publishes latest-SNAPSHOT. To publish a release, dispatch on
# its tag once the tag exists:
#
#   gh workflow run build_docker.yml --ref v<version> -f image_tag=release
#
# The release check fails the run unless the tag matches package.json and the
# version is new, and it moves latest only for the highest version. Start one
# release at a time: two runs started together can both pass the check before
# either pushes.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag type"
        required: false
        type: choice
        options:
          - "latest"
          - "release"
        default: "latest"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Snapshot builds replace each other. A release gets a group of its own, so
  # a merge to main can't cancel it, or replace it while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == 'release' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == 'release' }}
      # Where every step pushes and reads, including scripts/releaseImage.ts.
      IMAGE: public.ecr.aws/neptune/graph-explorer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: ${{ env.IS_RELEASE == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Runs before anything is pushed.
      - name: Check the release and choose its tags
        id: release
        if: ${{ env.IS_RELEASE == 'true' }}
        run: node scripts/releaseImage.ts plan

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_ECR }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_ECR }}
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_ECR }}
          role-duration-seconds: 3600
          role-session-name: ExplorerImageUpdate

      - name: Login to Amazon ECR
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Build, tag, and push Docker image
        env:
          # Snapshot runs skip the plan, so they push the snapshot tags.
          TAGS: ${{ steps.release.outputs.tags || 'latest-SNAPSHOT sagemaker-latest-SNAPSHOT' }}
        # TAGS is a space-separated list.
        run: |
          read -ra tags <<< "$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(-t "$IMAGE:$tag")
          done
          docker buildx build --platform linux/amd64,linux/arm64 \
            "${tag_args[@]}" --push .

      - name: Check every pushed tag points to one image
        if: ${{ env.IS_RELEASE == 'true' }}
        env:
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          read -ra tags <<< "$TAGS"
          node scripts/releaseImage.ts verify "${tags[@]}"
