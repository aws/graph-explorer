name: Build Docker image and publish to ECR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag type"
        required: false
        type: choice
        options:
          - "latest"
          - "release"
        default: "latest"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Snapshot builds replace each other. A release gets a group of its own, so
  # a merge to main can't cancel it, or replace it while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == 'release' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get package version
        id: package-version
        run: echo "version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: Get image tag
        id: get-image-tag
        env:
          IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == 'release' }}
          VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            echo "image_tag=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "image_tag=latest-SNAPSHOT" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_ECR }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_ECR }}
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_ECR }}
          role-duration-seconds: 3600
          role-session-name: ExplorerImageUpdate

      - name: Login to Amazon ECR
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb

      - name: Build, tag, and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
          REGISTRY_ALIAS: neptune
          REPOSITORY: graph-explorer
          IMAGE_TAG: ${{ steps.get-image-tag.outputs.image_tag }}
        run: |
          image=$REGISTRY/$REGISTRY_ALIAS/$REPOSITORY
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$image:$IMAGE_TAG" -t "$image:sagemaker-$IMAGE_TAG" \
            --push .

      - name: Update latest tag for release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag == 'release' }}
        env:
          REGISTRY: ${{ steps.login-ecr-public.outputs.registry }}
          REGISTRY_ALIAS: neptune
          REPOSITORY: graph-explorer
          IMAGE_TAG: ${{ steps.get-image-tag.outputs.image_tag }}
        run: |
          image=$REGISTRY/$REGISTRY_ALIAS/$REPOSITORY
          # With one source, imagetools create copies the index unchanged, so
          # latest keeps the release's digest.
          docker buildx imagetools create -t "$image:latest" -t "$image:sagemaker-latest" "$image:$IMAGE_TAG"
