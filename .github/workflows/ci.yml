name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job rather than parallel jobs or test shards: runners come from a pool
  # shared across the org, and each extra job is another wait in that queue.
  checks-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs Vite+ at the version pinned in pnpm-workspace.yaml, then Node
      # from .node-version and pnpm from packageManager.
      - name: Set up Vite+ and install dependencies
        id: install
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      # The steps below run even when an earlier one fails, so a single push
      # reports every failure instead of stopping at the first.
      - name: Check for lockfile drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm dedupe --check

      - name: Run type, lint, and format checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm checks

      - name: Run package tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
