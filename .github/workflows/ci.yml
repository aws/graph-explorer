name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job rather than parallel jobs or test shards: runners come from a pool
  # shared across the org, and each extra job is another wait in that queue.
  checks-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Install package and dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # The steps below run even when an earlier one fails, so a single push
      # reports every failure instead of stopping at the first.
      - name: Check for lockfile drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm dedupe --check

      - name: Run type, lint, and format checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm checks

      - name: Run package tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
