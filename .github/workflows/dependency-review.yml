name: Dependency Review

on:
  pull_request:
    branches:
      - main
    # The files the dependency graph reads: manifests, plus the action pins in
    # workflows. A pull request that touches none has nothing to review.
    paths:
      - "pnpm-lock.yaml"
      - "**/package.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies for vulnerabilities
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
