version: 2
updates:
  # Covers both `FROM` lines in Dockerfile. Daily because a new Amazon Linux
  # 2023 snapshot is a single ungrouped dependency, so a run without one is a
  # no-op. A Vite+ image bump must land with the matching vite-plus catalog
  # bump, since the image's vp and the project's vite-plus are the same release.
  # test_build_docker.yml fails while the two differ.
  #
  # No `cooldown`: it needs a registry-assigned publication date, and Docker Hub's
  # tag_last_pushed is currently the only accepted source. ECR Public has none, so
  # any cooldown here would be silently skipped.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "13:00"
      timezone: America/Chicago
    open-pull-requests-limit: 2

  # actions/checkout is pinned in every workflow, so an ungrouped bump would
  # open one pull request per workflow for one version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  # `npm` is the correct ecosystem for pnpm. Weekly rather than daily because a
  # change in target versions closes and replaces the open group pull request,
  # which for a ~130 dependency group would happen on nearly every daily run.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    # Babel 8 builds and passes tests, but babel-plugin-react-compiler still
    # depends on @babel/types 7 and silently skips some components under it
    # (fewer memo cache slots in the bundle). Revisit when the compiler supports
    # Babel 8. 7.x minor and patch bumps still come through.
    ignore:
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node major it describes, and we target Node LTS
      # (24, pinned in .node-version and the engines fields). A major bump
      # here would type against APIs the runtime does not have. Raise it by hand
      # when we move to the next LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # cva is pinned to an exact 1.0.0 beta. Later betas change the API, so no
      # update-types filter here: every bump needs the call sites adjusted and
      # has to be done by hand.
      - dependency-name: "cva"
    # Covers minimumReleaseAge: 1440 in pnpm-workspace.yaml, which refuses to
    # resolve a release under 24h old and would fail the lockfile step. Do not
    # remove as redundant with Dependabot's 3 day default — the margin is the point.
    cooldown:
      default-days: 2
    groups:
      # Each group below pairs packages that peer-depend on each other, and so
      # carries no update-types filter: it has to catch majors, which arrive
      # ungrouped otherwise. Listed before minor-and-patch because a dependency
      # joins the first group it matches.
      #
      # The catalog aliases vite to @voidzero-dev/vite-plus-core at the vite-plus
      # version, so every release splits them, not just majors. Vite, Vitest,
      # oxlint, and oxfmt fixes only arrive through vite-plus releases, and
      # advisories filed against vite no longer match the lockfile, so treat
      # these bumps as security updates.
      vite-plus:
        patterns: ["vite-plus", "@voidzero-dev/*", "vite"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      minor-and-patch:
        update-types: [minor, patch]
