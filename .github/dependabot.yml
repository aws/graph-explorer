version: 2
updates:
  # Covers both `FROM` lines in Dockerfile. Daily because a new Amazon Linux
  # 2023 snapshot is a single ungrouped dependency, so a run without one is a
  # no-op. The Vite+ image only supplies the global vp, which hands builds to
  # the project's installed vite-plus, so its tag can differ from the catalog
  # version and Dependabot bumps each on its own.
  #
  # No `cooldown`: it needs a registry-assigned publication date, and Docker Hub's
  # tag_last_pushed is currently the only accepted source. ECR Public and GHCR,
  # which hosts the Vite+ image, have none, so any cooldown here would be
  # silently skipped.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "13:00"
      timezone: America/Chicago
    open-pull-requests-limit: 2
    # A new Vite+ major is a hand upgrade of the image and the catalog
    # together, so a global vp from a newer major never lands ahead of the
    # project's vite-plus.
    ignore:
      - dependency-name: "voidzero-dev/vite-plus"
        update-types: ["version-update:semver-major"]

  # The same base image updates for the supported release branch, which patch
  # releases ship from. Only the newest minor line is supported, so this entry
  # moves to the new branch at each minor release. The 3.3.x Dockerfile pulls
  # only the Amazon Linux image, so the Vite+ ignore matches nothing there, but
  # it stays so the next branch, which has the Vite+ image, needs only a new
  # `target-branch`. Security updates still target only the default branch.
  - package-ecosystem: docker
    directory: /
    target-branch: "3.3.x"
    schedule:
      interval: daily
      time: "13:00"
      timezone: America/Chicago
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "voidzero-dev/vite-plus"
        update-types: ["version-update:semver-major"]

  # actions/checkout is pinned in every workflow, so an ungrouped bump would
  # open one pull request per workflow for one version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  # `npm` is the correct ecosystem for pnpm. Weekly rather than daily because a
  # change in target versions closes and replaces the open group pull request,
  # which for a ~130 dependency group would happen on nearly every daily run.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    # Majors are upgraded by hand, so Dependabot opens only minor and patch
    # updates. Some majors also wait on other work: Babel 8 until
    # babel-plugin-react-compiler supports it (under Babel 8 the compiler
    # silently skips some components), and @types/node until we move to the
    # next Node LTS in .node-version.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # cva is pinned to an exact 1.0.0 beta. Later betas change the API, so no
      # update-types filter here: every bump needs the call sites adjusted and
      # has to be done by hand.
      - dependency-name: "cva"
    # A supply-chain delay for version updates of three days. Dependabot also
    # never goes below minimumReleaseAge in pnpm-workspace.yaml. Neither
    # applies to security updates, which open as soon as an alert is raised.
    cooldown:
      default-days: 3
    groups:
      # Dependabot bumps vite-plus but not the vite catalog entry beside it
      # (the alias to @voidzero-dev/vite-plus-core), and never refreshes the
      # Vite+ block in AGENTS.md, so its pull request is finished by hand: move
      # the vite entry to the same version and run vp install. Merge it promptly. Vite, Vitest, oxlint, and oxfmt
      # fixes only arrive through vite-plus releases, and since the catalog
      # aliases vite to @voidzero-dev/vite-plus-core, fixes filed against vite
      # never match the lockfile.
      vite-plus:
        patterns: ["vite-plus", "@voidzero-dev/*", "vite"]
      # Everything else. A dependency joins every group it matches, and a group
      # without patterns never yields one to a more specific group, so the
      # Vite+ names are excluded here to keep them out of this pull request.
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["vite-plus", "@voidzero-dev/*", "vite"]
